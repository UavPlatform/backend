# ===== 测试专用配置（profile: test）=====
# Flyway 为唯一 DDL 来源；JPA 仅 validate 映射一致性（ADR-0001）。
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:drone_backend_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: test-jwt-secret-0123456789abcdef0123456789abcdef
  expiration: 3600000
  refresh-expiration: 604800000

trtc:
  sdk-app-id: 1400000000
  secret-key: test-trtc-secret-key-0123456789abcdef
  room-expire: 86400

amap:
  key: amap-test-key
  security-key: amap-test-security-key
  service-host: https://test.example/_AMapService

logging:
  level:
    root: warn
    com.uav: info

# Shared jdbc:h2:mem:drone_backend_test is visible across Spring contexts in one JVM.
# RealProtocol E2E tests commit WAITING_ACCEPTANCE+PAID dispatch orders; if this scheduler
# stays on (matchIfMissing=true), its 5s scan prepares statements on every IntegrationTestBase
# SessionFactory and flakes Hibernate Statistics assertions (e.g. RiderMyTasksViewIT N+1).
# Nearby ITs that need the job call DispatchNearbyService.process directly and already set false.
dispatch:
  nearby:
    scheduler-enabled: false
