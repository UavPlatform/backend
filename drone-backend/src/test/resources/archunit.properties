# ArchUnit freeze store. Creation and updates are disabled by default:
# CI must fail when the committed store is missing or incomplete.
# Refreeze only intentionally:
#   -Darchunit.freeze.refreeze=true -Darchunit.freeze.store.default.allowStoreUpdate=true
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false
